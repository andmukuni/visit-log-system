# Coolify deployment — single app container (API + SPA on one port).
# Secrets and DATABASE_URL: set in Coolify UI (Environment Variables tab).

services:
  node-template:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: ${DB_SSL:-0}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      APP_URL: ${APP_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@template.dev}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Visit Log Admin}
    volumes:
      - node_template_uploads:/app/uploads
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    # Local dev only:
    # ports:
    #   - "4000:4000"

volumes:
  node_template_uploads:
